; Ne pas annoncer la version de PHP dans les en-têtes HTTP
expose_php = Off
memory_limit = 256M
; Corps de requête limités (OWASP API4)
post_max_size = 1M
upload_max_filesize = 1M

; APCu : mémoire partagée entre les requêtes. "enable_cli" est indispensable : le serveur intégré
; (php artisan serve) et les tests tournent en mode ligne de commande.
apc.enabled = 1
apc.enable_cli = 1
apc.shm_size = 32M
