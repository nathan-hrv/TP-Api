# Pile de développement : serveur PHP intégré (php artisan serve). Aucun PHP sur l'hôte.
# Pas de base de données : les tâches sont gardées en mémoire partagée APCu (voir app/Services/TodoStore.php).
name: todo-laravel

services:
  # Génère une fois la paire de clés RSA des JWT (volume jwt-keys), puis s'arrête
  keys:
    image: alpine:3.20
    command: ["sh", "/generate-keys.sh"]
    volumes:
      - ./docker/generate-keys.sh:/generate-keys.sh:ro
      - jwt-keys:/keys

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        UID: "${UID:-1000}"                # aligne l'utilisateur du conteneur sur le vôtre (Linux)
        GID: "${GID:-1000}"
    environment:
      JWT_PUBLIC_KEY_PATH: /keys/publicKey.pem
      JWT_PRIVATE_KEY_PATH: /keys/privateKey.pem
      PHP_CLI_SERVER_WORKERS: "1"          # UN seul processus : la mémoire APCu y est partagée par toutes les requêtes
    ports:
      - "127.0.0.1:8080:8080"              # accessible depuis votre machine uniquement
    volumes:
      - ./:/var/www/html                   # le code de l'hôte, y compris .env
      - jwt-keys:/keys:ro
    depends_on:
      keys:
        condition: service_completed_successfully

  # Exécution des tests : docker compose run --rm tests
  tests:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    profiles: ["tools"]
    command: ["php", "artisan", "test"]
    volumes:
      - ./:/var/www/html

volumes:
  jwt-keys:
