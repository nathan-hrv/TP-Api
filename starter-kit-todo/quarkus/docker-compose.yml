# Pile de développement : Quarkus en mode dev (rechargement à chaud). Aucun Java ni Maven sur l'hôte.
# Pas de base de données : les tâches sont gardées en mémoire (voir TodoStore).
name: todo-quarkus

services:
  # Génère une fois la paire de clés RSA des JWT (volume jwt-keys), puis s'arrête
  keys:
    image: alpine:3.20
    command: ["sh", "/generate-keys.sh"]
    volumes:
      - ./docker/generate-keys.sh:/generate-keys.sh:ro
      - jwt-keys:/keys

  api:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /project
    command: ["mvn", "-B", "quarkus:dev", "-Ddebug=false", "-Dquarkus.http.host=0.0.0.0"]
    env_file: .env
    environment:
      JWT_PUBLIC_KEY_PATH: /keys/publicKey.pem
      JWT_PRIVATE_KEY_PATH: /keys/privateKey.pem
    ports:
      - "127.0.0.1:8080:8080"              # accessible depuis votre machine uniquement
    volumes:
      - ./:/project                        # le code de l'hôte, rechargé à chaque requête après modification
      - maven-repo:/root/.m2               # cache des dépendances Maven
      - jwt-keys:/keys:ro
    depends_on:
      keys:
        condition: service_completed_successfully

  # Exécution des tests : docker compose run --rm tests
  tests:
    image: maven:3.9-eclipse-temurin-21
    profiles: ["tools"]
    working_dir: /project
    command: ["mvn", "-B", "test"]
    environment:
      JWT_PUBLIC_KEY_PATH: /keys/publicKey.pem
      JWT_PRIVATE_KEY_PATH: /keys/privateKey.pem
    volumes:
      - ./:/project
      - maven-repo:/root/.m2
      - jwt-keys:/keys:ro
    depends_on:
      keys:
        condition: service_completed_successfully

volumes:
  maven-repo:
  jwt-keys:
