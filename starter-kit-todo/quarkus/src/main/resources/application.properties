# =============================================================================
# API Todo : configuration Quarkus
# Les valeurs sensibles viennent de l'environnement (fichier .env chargé par Docker Compose).
# Profils : %dev (quarkus:dev), %test (tests), sans préfixe = tous, dont la production.
# =============================================================================

# --- HTTP -------------------------------------------------------------------
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
# Corps de requête limités (OWASP API4 : consommation de ressources)
quarkus.http.limits.max-body-size=1M
# Faire confiance aux en-têtes X-Forwarded-* d'un reverse proxy placé devant l'API
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
# Authentification à la demande : les échecs passent par ExceptionMappers (réponse 401 en JSON)
quarkus.http.auth.proactive=false

# --- JSON : noms de champs en snake_case (created_at...) --------------------
quarkus.jackson.property-naming-strategy=SNAKE_CASE

# --- Développement ------------------------------------------------------------
quarkus.test.continuous-testing=disabled

# --- JWT : signature RS256 (clé privée), vérification (clé publique) --------
mp.jwt.verify.issuer=https://todo.example.test
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_PATH:/keys/publicKey.pem}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_PATH:/keys/privateKey.pem}
# Durée de vie des jetons (ISO 8601) : courte, un JWT ne se révoque pas facilement
todo.token-ttl=PT1H

# --- Comptes de démonstration (mots de passe lus dans .env) ------------------
todo.users.admin.password=${APP_ADMIN_PASSWORD:}
todo.users.user.password=${APP_USER_PASSWORD:}
%test.todo.users.admin.password=Admin-Test-Password-1
%test.todo.users.user.password=User-Test-Password-1

# --- Documentation OpenAPI : générée à partir du code ------------------------
quarkus.smallrye-openapi.path=/api/openapi
quarkus.smallrye-openapi.info-title=API Todo
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API de gestion de tâches du TP 3 (ESGI, API REST pour l'administration système)
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.swagger-ui.path=/api/docs
# Swagger UI est publié ici pour le TP ; en production : false (valeur par défaut)
quarkus.swagger-ui.always-include=true
